<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>독도 코리아 스쿨 · 명예의 전당</title>
<style>
/* OBS 브라우저 소스용.
   배경이 비어 있어 방송 화면 위에 그대로 얹힙니다.

   주소 뒤에 붙이는 값
     ?bg=1        어두운 배경 (눈으로 확인할 때만)
     ?scale=1.4   전체 확대
     ?rows=20     명단에 싣는 사람 수 (기본 60)
     ?only=school 학교 순위만  ·  ?only=person 사람 명단만
     ?page=4      한 장에 싣는 줄 수(기본 4). 넘치면 10초마다 다음 장으로 넘어갑니다
     ?page=0      장 넘기기를 끄고 예전처럼 한 번에 모두(길면 위로 흐름)
     ?sec=10      한 장을 보여 주는 초

   글자 크기는 vw 로 잡았습니다. 소스 너비를 키우면 글자도 같이 커집니다.
   화면에서 마우스로 늘이면 글자만 뭉개집니다. 크기는 소스 속성의 너비로 조절하십시오.

   명단이 소스 높이보다 길면 천천히 위로 흘렀다가 돌아옵니다.
   방송 자막처럼 끝까지 다 보이게 하려는 것입니다. */
:root{
  --gold:#F7B733; --ink:#EAF3FF; --dim:#9DB4CC; --line:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;
  font-family:"GmarketSans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
body.bg{background:#07131F}
#wrap{padding:2.2vw 2.6vw 1.4vw;transform-origin:top left}
.head{display:flex;align-items:baseline;gap:1.6vw;margin:0 0 1.6vw}
.head h1{margin:0;font-size:clamp(34px,9.2vw,86px);font-weight:800;color:var(--gold);
  letter-spacing:-.02em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.head small{font-size:clamp(18px,4.2vw,40px);color:var(--dim)}
.sec{margin:0 0 2.2vw}
.sec-t{font-size:clamp(22px,5.4vw,52px);font-weight:800;color:var(--gold);opacity:.85;
  letter-spacing:.02em;margin:0 0 .6vw}
.row{display:flex;align-items:center;gap:1.6vw;padding:.9vw 0;border-top:1px solid var(--line)}
.sec .row:first-of-type{border-top:none}
.m{font-size:clamp(30px,8vw,74px);width:7.5vw;min-width:26px;text-align:center;flex:none}
.m.num{font-size:clamp(21px,5vw,48px);color:var(--dim);font-weight:800;
  font-variant-numeric:tabular-nums}
.n{flex:1 1 auto;min-width:0;font-weight:800;font-size:clamp(30px,8.2vw,76px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,.7)}
.n .sch{font-weight:600;font-size:.56em;color:var(--dim);margin-left:.5em}
.v{flex:none;font-size:clamp(24px,6.4vw,58px);color:var(--gold);font-weight:800;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.v small{color:var(--dim);font-weight:600;font-size:.72em;margin-left:.4em}
.foot{font-size:clamp(15px,3.4vw,32px);color:var(--dim);opacity:.7;margin-top:1vw}
.empty{font-size:clamp(24px,6vw,56px);color:var(--dim);padding:1.4vw 0}
.live-dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#5CF0C0;
  margin-right:.5em;box-shadow:0 0 12px rgba(92,240,192,.9);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.4}}
.row.live{padding:.7vw 0}
.row.live .n{font-size:clamp(24px,6.4vw,58px)}
.row.live .v{font-size:clamp(19px,4.8vw,44px)}
/* 장 넘기기: 머리말은 그대로 두고 명단만 바뀝니다. */
.pg{transition:opacity .45s ease}
.pg.out{opacity:0}
.dots{font-size:.6em;letter-spacing:.25em;color:var(--dim);margin-left:.5em;font-weight:600}
.dots b{color:var(--gold);font-weight:800}
/* 1·2·3등만 살짝 빛나게 */
.row.first .n{color:#FFE7B0}
.row.first .m{filter:drop-shadow(0 0 8px rgba(247,183,51,.7))}
</style>
<style id="scr"></style>
</head>
<body>
<div id="wrap"><div class="empty">불러오는 중…</div></div>

<script>
/* 시트 주소 — 앱과 같은 곳을 봅니다. */
var SHEET_API="https://script.google.com/macros/s/AKfycbxhkR93f7__AekcpkHyd-pzfNHcPeQQK8HhHrtcRW6sLanzJGhPI3B2LRksxqrs1Uzelw/exec";

var Q=new URLSearchParams(location.search);
if(Q.get("bg"))document.body.classList.add("bg");
var SCALE=parseFloat(Q.get("scale")||"1");
var ROWS=Math.max(1,parseInt(Q.get("rows")||"60",10));
var ONLY=Q.get("only")||"";
var PAGE=Math.max(0,parseInt(Q.get("page")==null?"4":Q.get("page"),10)||0);
var SEC=Math.max(4,parseInt(Q.get("sec")||"10",10));
var CAT={E:"초등학교",M:"중학교",H:"고등학교",W:"해외 한국학교"};
var MEDAL=["🥇","🥈","🥉"];

function when(m){
  if(!(m>=0))return "";
  if(m<1)return "방금";
  if(m<60)return m+"분 전";
  var h=Math.round(m/60); return h<24?h+"시간 전":"오늘";
}

/* 'KR' 두 글자를 국기 그림으로 바꿉니다. 유니코드 지역 표시 문자를 씁니다.
   글꼴이 국기를 못 그리는 컴퓨터에서는 자리만 비웁니다. */
function flag(c){
  c=String(c||"").trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(c))return "";
  return String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65, 0x1F1E6+c.charCodeAt(1)-65);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function mark(i){
  return i<3 ? '<span class="m">'+MEDAL[i]+'</span>'
             : '<span class="m num">'+(i+1)+'</span>';
}
function rows(list,fmt,withFlag,off){
  off=off||0;
  return list.map(function(x,j){
    var i=j+off;
    var sch = x.school ? '<span class="sch">'+esc(x.school)+'</span>' : '';
    var fg  = (withFlag&&x.flag) ? flag(x.flag)+' ' : '';
    return '<div class="row'+(i===0?' first':'')+'">'+mark(i)
      +'<span class="n">'+fg+esc(x.name||x.nick)+sch+'</span>'
      +'<span class="v">'+fmt(x)+'</span></div>';
  }).join("");
}

function draw(f){
  var wk=(f.week||[]).slice(0,ROWS);
  /* 장(페이지) 목록을 만듭니다. 사람 명단을 PAGE줄씩 끊고, 학교 부문도 같은 방식으로 뒤에 붙입니다.
     한 장에 다 들어가면 장이 하나뿐이라 넘기지 않습니다(예전 화면과 같음). */
  var pages=[];
  function chunk(title,list,fmt,flagOn){
    var n=PAGE>0?PAGE:list.length||1;
    for(var k=0;k<list.length;k+=n)
      pages.push({t:title,h:rows(list.slice(k,k+n),fmt,flagOn,k)});
  }
  if(ONLY!=="school" && wk.length)
    chunk('이번 주 참여자 '+wk.length+'명',wk,function(x){return x.correct+'<small>문제</small>';},true);
  if(ONLY!=="person" && f.schools){
    ["E","M","H","W"].forEach(function(c){
      var l=f.schools[c]; if(!l||!l.length)return;
      chunk(CAT[c],l,function(x){return x.correct+'<small>문제 · '+x.people+'명</small>';},false);
    });
  }
  var head='<div class="head"><h1>명예의 전당</h1><small>이번 주'
    +(f.weekOf?' · '+f.weekOf+' 시작':'')+'</small></div>';
  var sig=head+JSON.stringify(pages);
  if(sig===LAST) return;          /* 내용이 같으면 넘기던 장을 그대로 둡니다 */
  LAST=sig; PAGES=pages;
  if(PI>=pages.length) PI=0;
  var w=document.getElementById("wrap");
  if(!pages.length){
    w.innerHTML=head+'<div class="empty">이번 주 기록이 아직 없습니다</div>'+FOOT;
    layout(); return;
  }
  if(PAGE===0){                   /* 넘기기 끔: 예전처럼 모두 펼치고 길면 흐름 */
    var all="",lastT="";
    pages.forEach(function(p){ all+= (p.t!==lastT?'<div class="sec-t">'+p.t+'</div>':'')+p.h; lastT=p.t; });
    w.innerHTML=head+'<div class="sec">'+all+'</div>'+FOOT; layout(); return;
  }
  w.innerHTML=head+'<div class="sec pg" id="pg"></div>'+FOOT;
  show();
}
var FOOT='<div class="foot">월요일 0시에 새 주가 시작됩니다 · dokdo-school.vercel.app</div>';
var PAGES=[],PI=0;
function show(){
  var el=document.getElementById("pg"); if(!el||!PAGES.length)return;
  var p=PAGES[PI],dots="";
  if(PAGES.length>1){ for(var i=0;i<PAGES.length;i++) dots+= i===PI?'<b>●</b>':'○'; dots='<span class="dots">'+dots+'</span>'; }
  el.innerHTML='<div class="sec-t">'+p.t+dots+'</div>'+p.h;
}
setInterval(function(){
  if(PAGE===0||PAGES.length<2)return;
  var el=document.getElementById("pg"); if(!el)return;
  el.classList.add("out");
  setTimeout(function(){ PI=(PI+1)%PAGES.length; show(); el.classList.remove("out"); },450);
},SEC*1000);
var LAST="";

/* 명단이 화면보다 길면 천천히 흘렀다가 돌아옵니다. 초당 22px.
   자동으로 줄여 버리면 아래쪽 사람들의 이름이 방송에 나오지 않습니다. */
function layout(){
  var w=document.getElementById("wrap");
  w.style.animation="";
  w.style.transform = SCALE!==1 ? "scale("+SCALE+")" : "";
  var over = w.scrollHeight*SCALE - window.innerHeight;
  if(over<=8) return;
  var dist = Math.ceil(over/SCALE);
  var dur  = Math.max(10, Math.round(over/22));
  document.getElementById("scr").textContent =
    "@keyframes roll{0%,10%{transform:scale("+SCALE+") translateY(0)}"
    +"90%,100%{transform:scale("+SCALE+") translateY(-"+dist+"px)}}";
  w.style.animation = "roll "+dur+"s ease-in-out infinite alternate";
}
addEventListener("resize",layout);

function load(){
  if(!SHEET_API){
    document.getElementById("wrap").innerHTML=
      '<div class="empty">시트 주소가 비어 있습니다. hall.html 의 SHEET_API 를 채워 주세요.</div>';
    return;
  }
  fetch(SHEET_API+"?ts="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){ if(j)draw(j); })
    .catch(function(){});
}
load();
setInterval(load,30000);
</script>
</body>
</html>
